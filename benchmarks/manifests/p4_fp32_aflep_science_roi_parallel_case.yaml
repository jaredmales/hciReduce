execution_control:
  artifact_root: working/fp32/end_to_end/4869c2a/aflep_science_roi_parallel4/runs
  sequential_only: true
  affinity:
    taskset_logical_cpus: [4, 6, 8, 10]
    physical_cores: [2, 3, 4, 5]
    core_class: performance
    smt_siblings_excluded: [5, 7, 9, 11]
  environment:
    LC_ALL: C
    OMP_NUM_THREADS: "4"
    OMP_DYNAMIC: "FALSE"
    OMP_PROC_BIND: close
    OMP_PLACES: "{4},{6},{8},{10}"
    OMP_DISPLAY_ENV: VERBOSE
    OPENBLAS_NUM_THREADS: "1"
    MKL_NUM_THREADS: "1"
    LD_LIBRARY_PATH: /home/jrmales/Source/mxApps/hciReduce/working/fp32/end_to_end/4869c2a/aflep_bounded_fixed1:/usr/local/lib
  outer_openmp_threads: 4
  inner_blas_lapack_threads: 1
  thermal_admission:
    poll_interval_seconds: 2
    timeout_seconds: 60
    condition: TCPU at most 65 C and x86_pkg_temp at most 70 C in the same poll
    zones:
      - {path: /sys/class/thermal/thermal_zone2, expected_type: TCPU, maximum_celsius: 65}
      - {path: /sys/class/thermal/thermal_zone13, expected_type: x86_pkg_temp, maximum_celsius: 70}
    failure_action: Stop without launching after timeout or a zone-type mismatch.
  invocation_argv: >-
    taskset -c 4,6,8,10 /usr/bin/time --verbose --output {time_report}
    {runner} --config {archived_run_config} --precision {candidate_id}
    --input.deleteBack 525 --geom.minRadius 7 --geom.maxRadius 15
    --p4.modeFractions 0.05,0.2,0.5 --p4.memoryFraction 0
    --p4.rankTolerance 0 --output.directory {run_directory}
    --output.fileName product.fits --output.exactFName=true --showTiming=true

schedule:
  - {position: 0, run_id: parallel4-pos0-p4-d64, candidate_id: P4-D64}
  - {position: 1, run_id: parallel4-pos1-p4-m32d64, candidate_id: P4-M32D64}
  - {position: 2, run_id: parallel4-pos2-p4-f32, candidate_id: P4-F32}

required_comparisons:
  science_payload:
    formula: exact bitwise equality to the same candidate's fixed-one-worker primary array
    limit: {op: equal, maximum_ulp_distance: 0, mismatch_count: 0}
    nan_rule: NaN payload bits are ignored only after exact NaN-location equality.
    evidence: [payload hashes, finite-mask hashes, maximum ULP distance, first mismatch coordinate]
  header:
    permitted_differences:
      - {keyword: P4 MAXIMUM WORKERS, fixed_one: "1", parallel_four: "4"}
      - {keyword: P4 EFFECTIVE WORKERS, fixed_one: "1", parallel_four: "4"}
    every_other_card: exact
  structure:
    exact: [BITPIX, shape, selection, predictor_count, fit_count, rank, modes, invalid_counts, fallback_counts]
  timing_and_rss:
    disposition: diagnostic-only single samples; no performance comparison or pass

gate_disposition_before_run:
  stored.same_backend_repeatability:
    case_scope: detector-frame direct AF Lep science-ROI path
    passed: to_be_measured
    promotion_blocking_outside_scope: true
  performance.end_to_end_wall_time: {available: false, passed: null, reason: single unpaired diagnostic samples}
  science.residual_product: {available: false, passed: null, reason: cross-worker check only}
  science.real_fit_rank_ambiguity: {available: false, passed: null, reason: per-fit spectra are not exported}
  promotion_ready: false
