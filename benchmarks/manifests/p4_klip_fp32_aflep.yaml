cpu_precision_microbenchmark:
  status: engineering-capability-smoke
  acceptance_binding: pre-contract-non-binding
  source_path_at_run: benchmarks/p4PrecisionBenchmark.cpp
  source_at_run_sha256: 649ddacce8d1946784b8aad9927e6f3fa767724d47d3aa6b130396230633ccc7
  source_bytes_archived: false
  current_source_differs_from_run: true
  reproducibility_limit: >-
    Exact raw rows and the run executable are archived, but the original
    source bytes are not; use this section as historical exploration only.
  scope: well-conditioned uncentered in-sample Gram/eigensolve/projection microkernel
  excluded:
    - numerical-rank selection and threshold-boundary behavior
    - centered and held-out fits
    - coefficients and probes
    - output-plane materialization and end-to-end reduction work
    - independent direct-SVD accuracy oracle
  candidates:
    P4-D64: {calculation: FP64, eigensolve: FP64}
    P4-M32D64: {calculation: FP32, eigensolve: FP64}
    P4-F32: {calculation: FP32, eigensolve: FP32}
  common_environment:
    openblas_num_threads: 1
    omp_num_threads: 1
    omp_dynamic: false
    omp_proc_bind: close
    omp_places: cores
    process_allowed_cpu_affinity: 0-19
    fixed_hybrid_core_pin: false
    seed: 42
    execution_order: rotating candidate order in complete balanced triplets
    validation_scope: one separate execution before timed workspaces and warmups
    command_template: >-
      env OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1 OMP_DYNAMIC=FALSE
      OMP_PROC_BIND=close OMP_PLACES=cores /usr/bin/time -v
      _build_cpu_precision/benchmarks/p4PrecisionBenchmark --samples T
      --predictors K --modes N --warmups W --repetitions R
    peak_rss_measurement: /usr/bin/time -v; one shared-process value, not candidate-specific
