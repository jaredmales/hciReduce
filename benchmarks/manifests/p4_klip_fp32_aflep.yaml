known_measurement_caveats:
  - The four earlier application smoke profiles have only one observation each and cannot support a speed claim.
  - Both balanced fixed-one-worker P4 matrices reached 99.05 C at TCPU process boundaries; their timings remain preliminary engineering evidence, not accepted performance results.
  - The four-worker science-ROI timings are single unpaired diagnostics; process ends reached 98.05 to 99.05 C despite thermal admission.
  - The managed execution environment printed stream-fd warnings during KLIP runs; repeat outside it for final timing.
  - P4 and KLIP read the same 256x256 files, but KLIP crops to 128x128 from its configured maximum radius.
  - The P4 smoke profile used the config's effective zero rank threshold; synthetic exact dependencies expose raw rank differences, and real-fit ambiguity/product sensitivity remains required.
  - Production configs and archived products are ignored by Git; verify their hashes before every measured run.
  - The initial well-conditioned P4 timing rows were not pinned to one homogeneous core class; rank-sensitive P4 and KLIP rows were pinned to logical CPU 4.
  - The synthetic P4 ambiguity band is construction-specific and cannot be reused as a real-fit or science tolerance.
  - Current KLIP timings exclude reference selection, collapse, OpenMP scheduling, and multi-mode product materialization.
  - Formal acceptance cases not yet emitted include the exact-after-FP32-quantization threshold family, the exact-zero matrix, requested-mode clusters, and the complete KLIP rank-boundary and stored-product case sets.
  - Contract-v1 timing rows are kernel diagnostics and intentionally leave the owner-TBD end-to-end performance gate unavailable; they cannot establish an application speedup.
  - Fourteen of eighteen applicable rank rows retain unresolved in-band ambiguity despite exact outside-band agreement; every contract-bound row therefore remains promotion_ready=false.
  - The wide explicit-held-out FP32 coefficient path currently exports coefficients through FP64 and recasts them to FP32 after the recorded PCA timing; account for that conversion or retain typed scratch before using held-out stage timing for a decision. The detector-frame AF Lep timings above do not use this path.
  - Production probe-output alias rejection is covered indirectly through the experimental wrapper, and exact DD reduction-dispatch equivalence is direct-detector-only; add direct alias coverage plus centered, held-out, and frozen-probe DD equivalence cases before promotion.
  - Huge synthetic held-out/probe dimensions could overflow result-column arithmetic or narrow into LAPACK int parameters; those boundaries need explicit checks before the experimental API can be supported externally.
