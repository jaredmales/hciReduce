schema: hcireduce-pca-precision-manifest/v1
created: "2026-09-02"
status: active-engineering-evaluation
purpose: >-
  Reproduce the AF Lep/NACO baseline and bounded precision experiments for
  HCI-015. Application profiles and synthetic kernel measurements remain
  engineering evidence, not a production precision decision.

acceptance_contract:
  path: benchmarks/manifests/p4_klip_fp32_acceptance.yaml
  sha256: 255f70885da886504be1ab9ae43ef5e587cee1ef6454a946116e40da10d1135c
  current_result_binding: mixed-legacy-contract-v1-and-descriptor-bound-incomplete
  reason: >-
    The archived 30-, 54-, and 33-field CSV rows predate the contract and remain
    non-binding. The contract_v1 directory contains exact-hash-bound 94-field v2
    rows for twelve covered cases. Descriptor-bound P4 matrices now add an
    all-NaN bounded timing case, a finite detector-frame science-ROI case, and
    a scoped exact one-versus-four-worker repeatability result. Required case
    families and owner-TBD science/performance gates remain incomplete, so no
    candidate is promotion-ready.
  required_next_step: >-
    Add the missing synthetic, production-mapping, real-fit ambiguity, science,
    performance, automatic-memory concurrency, path, and platform cases against
    this exact contract hash, and approve owner-TBD limits and aggregations
    before making a promotion decision.

