required_comparisons:
  compatibility:
    - production-control product and every experimental-runner P4-D64 product are byte-identical
    - production-control and runner P4-D64 headers, validity masks, shape, plane order, and data bits are exact
  support_domains:
    global: corresponding finite global support, reported independently per plane and pooled globally
    roi: all 132 P4-convention [10,12) pixels, reported independently per plane and pooled across planes
  stored_bit_diagnostics:
    acceptance_id: stored.bit_diagnostics
    required_for: [P4-M32D64, P4-F32]
    metrics: [valid_comparison_count, exact_equal_count, exact_equal_fraction, maximum_ordered_float_ulp_distance, difference_rms, absolute_difference_p50, absolute_difference_p95, absolute_difference_p99, absolute_difference_p99_9, absolute_difference_maximum]
    required_aggregation: [global_per_plane, global_pooled, roi_per_plane, roi_pooled]
    evidence: [ULP convention, finite-mask hashes, mismatch counts and coordinates]
  residual_product:
    acceptance_id: science.residual_product
    required_for: [P4-M32D64, P4-F32]
    metrics: [baseline_rms, difference_rms, difference_over_baseline_rms, absolute_difference_p99, absolute_difference_p99_9, absolute_difference_maximum, pearson_correlation, through_origin_slope]
    required_aggregation: [global_per_plane, global_pooled, roi_per_plane, roi_pooled]
    evidence: [valid comparison counts and masks, worst case, one-annulus identity]
  exact_and_repeatability:
    - FITS byte count, BITPIX, dimensions, ordered mode metadata, selection, rank, fit counts, and fallback counts
    - finite and NaN counts plus finite-mask hashes globally, by plane, and in the ROI
    - same-candidate product hashes, maximum ULP distance, and mismatch coordinates across six repeats
  performance:
    - every raw wall, algorithm, stage-timing, and maximum-RSS sample in execution order
    - per-candidate median, range, and median absolute deviation
    - paired P4-D64-over-candidate speedups and peak-RSS ratios
    - geometry, sampling, Gram, eigensolve, projection, derotation, combination, I/O, affinity, thread environment, load, frequency, and available thermal evidence

gate_disposition_before_run:
  frozen_exact_checks:
    - exact.p4_d64_compatibility
    - exact.run_identity
    - exact.output_layout
    - exact.selection
    - exact.validity
    - stored.structure
  measured_without_owner_limit:
    - id: stored.bit_diagnostics
      evidence_available: required
      gate_available: false
      passed: null
      reason: Frozen report-only diagnostics have no acceptance limit.
    - id: science.residual_product
      evidence_available: required
      gate_available: false
      passed: null
      reason: Every metric is required, but aggregation and limits remain owner-TBD.
    - id: performance.end_to_end_wall_time
      evidence_available: required
      gate_available: false
      passed: null
      reason: Timing and RSS evidence are required, but uncertainty and limits remain owner-TBD.
    - id: stored.same_backend_repeatability
      evidence_available: partial
      gate_available: false
      passed: null
      reason: Fixed-one-worker repeats are measured; the required one-versus-many comparison is unavailable.
  unavailable_owner_tbd:
    - {id: performance.primary_workload_regression, available: false, passed: null}
    - {id: performance.memory_and_concurrency, available: false, passed: null}
    - {id: science.injected_source_throughput, available: false, passed: null}
    - {id: science.photometry_and_contrast, available: false, passed: null}
    - {id: science.astrometry, available: false, passed: null}
    - {id: science.detection_behavior, available: false, passed: null}
    - {id: science.p4_optimizer, available: false, passed: null}
    - {id: science.p4_model_products, available: false, passed: null}
  unavailable_real_fit:
