execution_control:
  launch_directory: /home/jrmales/Source/mxApps/hciReduce
  artifact_root: working/fp32/end_to_end/4869c2a/aflep_science_roi_fixed1/runs
  sequential_only: true
  affinity: {tool: taskset, logical_cpu: 4}
  common_environment:
    LC_ALL: C
    OMP_NUM_THREADS: "1"
    OMP_DYNAMIC: "FALSE"
