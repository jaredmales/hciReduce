  inner_blas_lapack_threads: 1
  thermal_admission:
    scope: before every production-control, warmup, and measured process
    poll_interval_seconds: 2
    timeout_seconds: 60
    condition: both zone temperatures must be at or below their thresholds in the same poll
    zones:
      - {path: /sys/class/thermal/thermal_zone2, expected_type: TCPU, maximum_celsius: 65}
      - {path: /sys/class/thermal/thermal_zone13, expected_type: x86_pkg_temp, maximum_celsius: 70}
    failure_action: Mark the process failed-not-launched and stop; do not run after timeout or a zone-type mismatch.
    evidence: >-
      Record each zone path and observed type, the temperature at gate start,
      every two-second poll, the admitted launch temperature, and the
      immediate post-process temperature in every run directory.
    rationale: >-
      The first bounded matrix observed TCPU 64.05--99.05 C and package
      72--85 C; that timing evidence is thermally limited and is not an
      admissible timing baseline for this case.
  control_ld_library_path: /home/jrmales/Source/mxApps/hciReduce/working/fp32/end_to_end/4869c2a/aflep_science_roi_fixed1:/usr/local/lib
  experimental_ld_library_path: /home/jrmales/Source/mxApps/hciReduce/working/fp32/end_to_end/4869c2a/aflep_bounded_fixed1:/usr/local/lib
