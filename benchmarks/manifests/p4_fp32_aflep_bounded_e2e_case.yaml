    - {run_id: warmup-p4-d64, candidate_id: P4-D64}
    - {run_id: warmup-p4-m32d64, candidate_id: P4-M32D64}
    - {run_id: warmup-p4-f32, candidate_id: P4-F32}
  measured_balanced_order:
    - repetition: 0
      runs:
        - {position: 0, run_id: rep0-pos0-p4-d64, candidate_id: P4-D64}
        - {position: 1, run_id: rep0-pos1-p4-m32d64, candidate_id: P4-M32D64}
        - {position: 2, run_id: rep0-pos2-p4-f32, candidate_id: P4-F32}
    - repetition: 1
      runs:
        - {position: 0, run_id: rep1-pos0-p4-m32d64, candidate_id: P4-M32D64}
        - {position: 1, run_id: rep1-pos1-p4-f32, candidate_id: P4-F32}
        - {position: 2, run_id: rep1-pos2-p4-d64, candidate_id: P4-D64}
    - repetition: 2
      runs:
        - {position: 0, run_id: rep2-pos0-p4-f32, candidate_id: P4-F32}
        - {position: 1, run_id: rep2-pos1-p4-d64, candidate_id: P4-D64}
        - {position: 2, run_id: rep2-pos2-p4-m32d64, candidate_id: P4-M32D64}
    - repetition: 3
      runs:
        - {position: 0, run_id: rep3-pos0-p4-f32, candidate_id: P4-F32}
        - {position: 1, run_id: rep3-pos1-p4-m32d64, candidate_id: P4-M32D64}
        - {position: 2, run_id: rep3-pos2-p4-d64, candidate_id: P4-D64}
    - repetition: 4
      runs:
        - {position: 0, run_id: rep4-pos0-p4-m32d64, candidate_id: P4-M32D64}
        - {position: 1, run_id: rep4-pos1-p4-d64, candidate_id: P4-D64}
        - {position: 2, run_id: rep4-pos2-p4-f32, candidate_id: P4-F32}
    - repetition: 5
      runs:
        - {position: 0, run_id: rep5-pos0-p4-d64, candidate_id: P4-D64}
        - {position: 1, run_id: rep5-pos1-p4-f32, candidate_id: P4-F32}
        - {position: 2, run_id: rep5-pos2-p4-m32d64, candidate_id: P4-M32D64}

oracle_product:
  path: working/fp32/baseline/4869c2a/p4_d64_bounded.fits
  sha256: 9dff0820fe2f8390790a0c44499682b37f20f899c1d386013864cff439fd4774
  expected_compatibility: Every measured P4-D64 product must be byte-identical to this artifact.
  known_limitation: >-
    The FITS layout and header are valid and report 132 valid fits, but this
    narrow sigmaMean product contains zero finite science values out of
    196608. It is useful for timing, compatibility hashes, metadata/validity,
    and fixed-environment repeatability, not residual-science comparison.

required_diagnostics:
  per_run:
    - exit status and exact candidate/run identity
    - product SHA-256, byte count, FITS header, BITPIX, shape, and ordered plane metadata
    - finite, NaN, and validity counts and masks by plane
    - whole-process wall seconds and maximum resident set size in KiB
    - benchmark algorithm elapsed seconds and complete ReductionTiming output
    - P4 geometry, sampling, Gram, eigensolve, projection, derotation, and combination timings
    - realized modes, rank metadata, fit counts, fallback counts, and worker counts
    - affinity, thread environment, runtime link map, load average, CPU frequency, and available thermal readings
  aggregate:
    - every raw measured sample in execution order
    - per-candidate median, range, and median absolute deviation for wall, algorithm, and stage timing
    - paired P4-D64-over-candidate speedup and fractional improvement, with pairing stated explicitly
    - peak-RSS values and ratios
    - exact output/header/plane/validity comparisons against P4-D64
    - same-candidate repeat product hashes and mismatch coordinates

gate_disposition_before_run:
  frozen_exact_checks:
    - exact.run_identity
    - exact.output_layout
    - exact.selection
    - exact.validity
    - stored.structure
  diagnostic_only:
    - id: stored.bit_diagnostics
      available: false
      passed: null
      reason: The declared oracle product has no finite science-value pairs.
    - id: science.residual_product
      available: false
      passed: null
      reason: The declared oracle product has no finite science-value pairs.
    - id: stored.same_backend_repeatability
      available: partial
      passed: null
      reason: Fixed-one-worker repeats are measured; the required one-versus-many comparison is not.
    - id: performance.end_to_end_wall_time
      available: measurements-only
      passed: null
      reason: Samples and summary statistics are recorded, but aggregation, uncertainty, and limits are owner-TBD.
  unavailable_owner_tbd:
    - performance.primary_workload_regression
    - performance.memory_and_concurrency
    - science.injected_source_throughput
    - science.photometry_and_contrast
    - science.astrometry
    - science.detection_behavior
    - science.p4_optimizer
    - science.p4_model_products
  unavailable_real_fit:
    - id: science.real_fit_rank_ambiguity
      passed: null
      reason: The benchmark runner does not export per-fit eigenvalues, screening bands, or affected-fit identities.
  promotion_ready: false
