# AF Lep/NACO KLIP configuration for the sparse frozen-basis PSF-response
# experiment. It follows working/kr.conf while selecting the currently
# supported analytic-response path: complete annuli, imageMean centering,
# no pixel time-series normalization, derotation, and final combination.
#
# The input angle constant follows working/roc/p4Reduce_afLepNaco.conf so the
# P4 and KLIP response experiments use the same sky orientation.

mode=normal

[input]
directory=/home/jrmales/Data/NACO/AFLep/2011-10-21/obs/full2/cut/reg/coadd5/pp
prefix=pp
extension=.fits
fileList=
deleteFront=0
deleteBack=0
qualityFile=
qualityThreshold=0
thresholdOnly=false
dateKeyword=
imSize=0
maskFile=
angleKeyword=POSANG
angleScale=1
angleConstant=1.6

[rdi]
directory=
prefix=
extension=.fits
fileList=
deleteFront=0
deleteBack=0
qualityFile=
qualityThreshold=0
dateKeyword=
maskFile=
useInputMask=false

[coadd]
method=none
maxImno=0
maxTime=0

[preProcess]
skip=true
inherit=true

[adi]
postMedSub=false
excludeMethod=imno
minDPx=0

[fake]

[geom]
minRadius=6
maxRadius=60

[klip]
meanSubMethod=imageMean
pixelTSNormMethod=none
includeMethod=all
includeRefNum=0
Nmodes=125,150,175,200,225,250,300,350
rightReason=false
writeDiagnostics=false

[combine]
method=sigmaMean
weightFile=
sigmaThreshold=5
minGoodFract=0.5
noDerotate=false

[output]
directory=.
fileName=finim.fits
exactFName=true
outputPSFSub=false
psfSubPrefix=
