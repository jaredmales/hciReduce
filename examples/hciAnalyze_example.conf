# Basic hciAnalyze configuration for one PSF-subtracted FITS cube.
#
# Run with:
#   hciAnalyze --config /path/to/hciAnalyze.conf

file=/path/to/final_psfsub.fits

# Print the resolved annulus, image coordinates, invalid-pixel counts, and aperture SNRs to stderr.
diagnostics=true

[planet]
# Separation in pixels. PA is degrees east of north: north is up and east is left.
sep=20
PA=90
# R=10 is the default exclusion radius; set a custom value when needed.
R=8

[snr]
# Use positive values to override REGMINR/REGMAXR in the FITS header.
minRad=8
maxRad=60
apertureR=2

[filter]
# Set either value to zero or negative to disable that filter.
hpfGaussFW=0
lpfGaussFW=0

# To use fake-planet FITS metadata instead, remove [planet] and ensure the input header has
# FAKESEP, FAKEPA, and FAKECONT.  An explicit [fake] group can override those lists:
#
# [fake]
# sep=20
# PA=90
# contrast=1e-4
# R=8
